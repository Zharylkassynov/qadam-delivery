<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Qadam — безопасная передача</title>
<style>
@font-face{font-family:Onest;src:url('/fonts/Onest-Variable.ttf')}*{box-sizing:border-box}body{margin:0;font:16px/1.5 Onest,Arial,sans-serif;background:#f3f6fa;color:#122f43}button,input,select{font:inherit}button,select{cursor:pointer}button:disabled{cursor:default}button:focus-visible,select:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid #80bdff;outline-offset:3px}.tools{max-width:1220px;margin:auto;padding:24px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}.tools p{margin:0;flex:1 1 250px;font-size:14px;color:#526779}.tools button,.tools select{min-height:44px;padding:8px 12px;border:1px solid #dce5ef;border-radius:8px;background:white;color:#122f43}.stage{padding:0 24px 32px;display:flex;justify-content:center;gap:32px;align-items:start}.frame{width:390px;flex:0 0 auto;background:var(--surface);color:var(--ink);--ink:#122f43;--muted:#526779;--surface:#fff;--canvas:#f3f6fa;--line:#dce5ef;--action:#2455db;--link:#2455db;--soft:#eaf0ff;border:1px solid var(--line);border-radius:22px;overflow:hidden}.frame.dark{--ink:#edf4fb;--muted:#aabdd0;--surface:#172737;--canvas:#101b26;--line:#354a5e;--action:#2b6cbb;--link:#80bdff;--soft:#203c58}.appbar{display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 20px;background:var(--surface);font-weight:600;font-size:15px}.appbar span:first-child{font-size:24px}.appbar span:last-child{font-size:22px}main{min-height:684px;padding:20px;background:var(--canvas)}.eyebrow{margin:0 0 4px;color:var(--muted);font-size:13px}h1{font-size:25px;line-height:32px;margin:0 0 20px;font-weight:600}h2{font-size:18px;line-height:26px;margin:0 0 12px;font-weight:600}p{margin:0 0 12px}.target{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0;margin-bottom:16px;display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px}.target .letter{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;background:var(--surface);font-weight:600}.target small{color:var(--muted);display:block;font-size:13px}.target strong{font-weight:500;display:block}.primary,.secondary{width:100%;min-height:52px;border:0;border-radius:10px;padding:12px 16px;font-weight:600}.primary{background:var(--action);color:#fff}.primary:disabled{opacity:.48}.secondary{background:var(--surface);color:var(--link);border:1px solid var(--line)}.nav-options{display:flex;gap:16px;padding:12px 0 16px;font-size:14px}.nav-options button{border:0;background:none;color:var(--link);padding:6px 0;min-height:36px}.contact{width:100%;text-align:left;display:flex;gap:12px;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink);min-height:54px}.contact small{display:block;color:var(--muted);font-size:12px}.contact span:last-child{color:var(--link);font-size:14px}.map{height:145px;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:16px 0 8px}.map svg{width:100%;height:100%;display:block}.map .caption{position:absolute;bottom:4px;right:7px;background:var(--surface);font-size:10px;color:var(--muted);padding:0 4px}.gps{font-size:12px;line-height:18px;color:var(--muted);margin-bottom:20px}.hint{font-size:13px;color:var(--muted);margin:12px 0}.notice{padding:12px 14px;margin-bottom:16px;border-left:3px solid var(--link);background:var(--surface);font-size:14px}.code{font-size:30px;letter-spacing:8px;font-weight:600;margin:12px 0}.code-field{display:block;width:100%;min-height:58px;border:1px solid var(--line);border-radius:8px;text-align:center;font-size:28px;letter-spacing:8px;color:var(--ink);background:var(--surface);padding:8px}.code-form{border-top:1px solid var(--line);padding-top:18px;margin:20px 0}.code-form label{display:block;font-size:14px;margin-bottom:8px}.sheet{border-top:1px solid var(--line);margin-top:20px}.sheet summary{padding:14px 0;min-height:48px;cursor:pointer;color:var(--muted);font-size:14px}.sheet p{font-size:13px;color:var(--muted)}.sheet button{display:block;background:none;color:var(--link);border:0;min-height:44px;text-align:left;padding:8px 0}.bottom{padding:12px 16px 18px;background:var(--surface)}.caption-note{font-size:11px;color:var(--muted);margin:0 0 8px;text-align:center}.status-line{display:flex;gap:10px;align-items:center;margin:18px 0;color:var(--muted);font-size:14px}.dot{width:7px;height:7px;border-radius:50%;background:var(--link)}.secondary-actions{display:grid;gap:10px;margin-top:18px}.textonly{background:none;border:0;color:var(--link);padding:12px 0;min-height:44px}.skeleton-note{font-size:13px;color:#526779;max-width:390px;margin:16px auto 0}.test-output{color:var(--link);font-size:13px;margin:10px 0 0;min-height:20px}.frame input::placeholder{color:var(--muted);opacity:.8}@media(max-width:700px){.tools{padding:16px}.stage{padding:0 0 24px;display:block}.frame{width:100%;max-width:430px;border-radius:0;margin:auto;border-left:0;border-right:0}.companion{display:none}main{min-height:640px}.tools p{flex-basis:100%}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
@media(min-width:701px) and (max-width:950px){.companion{display:none}}
</style></head><body>
<div class="tools"><p><strong>Qadam · проверка нового потока.</strong> Это макет: кнопки не меняют реальные заказы, карта и коды условные.</p><select id="state" aria-label="Экран"><option value="pickup-far">Курьер · едет за посылкой</option><option value="pickup-code">Курьер · код при заборе</option><option value="transit">Курьер · в пути</option><option value="dropoff-code">Курьер · код при вручении</option><option value="customer">Клиент · отслеживание</option><option value="sender-code">Клиент · код забора</option><option value="recipient-code">Клиент · код получателю</option><option value="stale">Курьер · GPS устарел</option></select><button id="theme">Тёмная тема</button></div>
<div class="stage"><article class="frame" id="phone"></article><article class="frame companion" id="companion"></article></div>
<script>
const states={
'pickup-far':{role:'Курьер',title:'К отправителю',target:'А',address:'Алматы, Абая, 55',label:'Забрать посылку',gps:'До адреса ≈ 650 м по прямой',person:'Айгерим',personRole:'Отправитель',nav:true,button:'Подтвердить забор',disabled:true,hint:'Подтверждение откроется у отправителя.'},
'pickup-code':{role:'Курьер',title:'Заберите посылку',target:'А',address:'Алматы, Абая, 55',label:'Забрать посылку',gps:'Вы у отправителя · позиция обновлена',person:'Айгерим',personRole:'Отправитель',nav:false,codeInput:true,codeLabel:'Код отправителя',hint:'Проверьте посылку и попросите код при передаче.',button:'Подтвердить забор'},
'transit':{role:'Курьер',title:'К получателю',target:'Б',address:'Алматы, Самал-3, 1',label:'Доставить посылку',gps:'Позиция обновлена · 16:38',person:'Данияр',personRole:'Получатель',nav:true,button:'Подтвердить вручение',disabled:true,hint:'Подтверждение откроется у получателя.'},
'dropoff-code':{role:'Курьер',title:'Передайте посылку',target:'Б',address:'Алматы, Самал-3, 1',label:'Доставить посылку',gps:'Вы у получателя · позиция обновлена',person:'Данияр',personRole:'Получатель',nav:false,codeInput:true,codeLabel:'Код получателя',hint:'Получатель называет код при вручении посылки.',button:'Завершить доставку'},
'customer':{role:'Клиент',title:'Посылка в пути',target:'Б',address:'Алматы, Самал-3, 1',label:'Куда доставляем',gps:'Курьер обновил позицию · 16:38',person:'Арман',personRole:'Ваш курьер',button:'Поделиться доставкой',customer:true},
'sender-code':{role:'Клиент',title:'Курьер у отправителя',target:'А',address:'Алматы, Абая, 55',label:'Откуда забрать',person:'Арман',personRole:'Ваш курьер',showCode:true,hint:'Назовите код после проверки курьера и передачи посылки.',button:'Скопировать код',codeLabel:'Код забора',customer:true},
'recipient-code':{role:'Клиент',title:'Посылка в пути',target:'Б',address:'Алматы, Самал-3, 1',label:'Куда доставляем',person:'Арман',personRole:'Ваш курьер',showCode:true,hint:'Перешлите получателю. Курьеру код сообщают только при вручении.',button:'Отправить код в WhatsApp',codeLabel:'Код получателя',customer:true},
'stale':{role:'Курьер',title:'К получателю',target:'Б',address:'Алматы, Самал-3, 1',label:'Доставить посылку',gps:'Нет свежей позиции',person:'Данияр',personRole:'Получатель',nav:true,button:'Обновить позицию',hint:'Подтверждение вручения ждёт свежую геопозицию.'}
};
let dark=false;const select=document.querySelector('#state');
function map(){return '<div class="map" aria-label="Условная карта для макета"><svg viewBox="0 0 350 145" aria-hidden="true"><path d="M0 28H350M0 104H350M63 0V145M269 0V145" fill="none" stroke="var(--line)" stroke-width="12"/><path d="M92 103H179V43H251" fill="none" stroke="var(--link)" stroke-width="4"/><circle cx="92" cy="103" r="9" fill="var(--link)"/><circle cx="251" cy="43" r="9" fill="var(--ink)"/></svg><span class="caption">Условная карта</span></div>';}
function render(target,key){const s=states[key];target.classList.toggle('dark',dark);target.dataset.state=key;target.innerHTML=`<header class="appbar"><span aria-hidden="true">‹</span><span>Заказ QD-0067</span><span aria-hidden="true">···</span></header><main><p class="eyebrow">${s.role}</p><h1>${s.title}</h1><section class="target"><span class="letter">${s.target}</span><div><small>${s.label}</small><strong>${s.address}</strong></div></section>${s.nav?'<button class="primary nav-main">Маршрут в 2ГИС</button><div class="nav-options"><button>Яндекс Карты</button><button>Google Maps</button></div>':''}<button class="contact"><span><small>${s.personRole}</small>${s.person}</span><span>Позвонить</span></button>${s.codeInput?`<section class="code-form"><label>${s.codeLabel}<input class="code-field" inputmode="numeric" maxlength="6" placeholder="••••••" aria-label="${s.codeLabel}"></label><p class="hint">${s.hint}</p></section>`:s.showCode?`<section class="code-form"><h2>${s.codeLabel}</h2><p class="code" aria-label="Условный код">482 731</p><p class="hint">${s.hint}</p></section>`:map()}${s.gps?`<p class="gps">${s.gps}</p>`:''}${!s.codeInput&&!s.showCode&&s.hint?`<p class="hint">${s.hint}</p>`:''}${s.customer&&key==='customer'?'<div class="status-line"><span class="dot"></span>Курьер везёт посылку получателю</div>':''}<details class="sheet"><summary>${s.customer?'Подробности заказа':'Другие действия'}</summary>${s.customer?'<p>Получатель · Данияр<br>Оплата по согласованию</p><button>История доставки</button>':'<button>Настройки геопозиции</button><button>Поддержка</button><button>Закончить смену после доставки</button>'}</details><p class="test-output" aria-live="polite"></p></main><footer class="bottom"><p class="caption-note">Основное действие Telegram · макет</p><button class="primary main-action" ${s.disabled||s.codeInput?'disabled':''}>${s.button}</button></footer>`;
const input=target.querySelector('.code-field'),action=target.querySelector('.main-action');input?.addEventListener('input',()=>{input.value=input.value.replace(/\D/g,'');action.disabled=input.value.length!==6});for(const btn of target.querySelectorAll('button'))btn.addEventListener('click',()=>{target.querySelector('.test-output').textContent=btn.textContent.includes('Карт')||btn.classList.contains('nav-main')?'В приложении откроются выбранные карты.':'Действие макета. Реальный заказ не изменяется.';});}
function update(){render(document.querySelector('#phone'),select.value);render(document.querySelector('#companion'),select.value==='customer'?'transit':'customer');document.querySelector('#theme').textContent=dark?'Светлая тема':'Тёмная тема'}select.addEventListener('change',update);document.querySelector('#theme').onclick=()=>{dark=!dark;update()};window.preview={set(state,isDark){select.value=state;dark=isDark;update()},states:Object.keys(states)};update();
</script></body></html>
