name: Validate delivery flow

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: qadam
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: qadam_delivery
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qadam -d qadam_delivery"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://qadam:ci-test-only@127.0.0.1:5432/qadam_delivery
      TEST_DATABASE_URL: postgresql://qadam:ci-test-only@127.0.0.1:5432/qadam_delivery_test
      DEMO_PASSWORD: QadamDemo-2026!
      DEMO_AUTH_ENABLED: 'true'
      APP_ORIGIN: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - run: npm run db:test:setup
      - run: npm run typecheck
      - run: npm test
      - name: Build with Vercel Production configuration (synthetic credentials, no cloud connection)
        run: npm run build
        env:
          VERCEL: '1'
          VERCEL_ENV: production
          APP_ORIGIN: https://qadam-ci.example
          SUPABASE_PROJECT_REF: abcdefghijklmnopqrst
          DATABASE_URL: postgresql://qadam_app.abcdefghijklmnopqrst:ci-only@aws-example.pooler.supabase.com:6543/postgres
          DATABASE_SSL_CA_FILE: config/certs/supabase-root.crt
          DATABASE_POOL_MAX: '3'
          TELEGRAM_AUTH_ENABLED: 'true'
          TELEGRAM_BOT_TOKEN: '123456789:local_test_only_abcdefghijklmnopqrstuvwxyz'
          TELEGRAM_WEBHOOK_SECRET: 'local_test_only_webhook_secret_abcdefghijklmnopqrstuvwxyz'
      - run: npm run check:build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
