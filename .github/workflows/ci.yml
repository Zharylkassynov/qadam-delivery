name: Validate delivery flow

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: qadam
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: qadam_delivery
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qadam -d qadam_delivery"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://qadam:ci-test-only@127.0.0.1:5432/qadam_delivery
      TEST_DATABASE_URL: postgresql://qadam:ci-test-only@127.0.0.1:5432/qadam_delivery_test
      DEMO_PASSWORD: QadamDemo-2026!
      DEMO_AUTH_ENABLED: 'true'
      APP_ORIGIN: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - run: npm run db:test:setup
      - run: npm run typecheck
      - run: npm test
      - name: Build with Vercel Production configuration (synthetic credentials, no cloud connection)
        run: npm run build
        env:
          VERCEL: '1'
          VERCEL_ENV: production
          APP_ORIGIN: https://qadam-ci.example
          SUPABASE_PROJECT_REF: abcdefghijklmnopqrst
          DATABASE_URL: postgresql://qadam_app.abcdefghijklmnopqrst:ci-only@aws-example.pooler.supabase.com:6543/postgres
          DATABASE_SSL_CA_FILE: config/certs/supabase-root.crt
          DATABASE_POOL_MAX: '3'
      - run: npm run check:build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
